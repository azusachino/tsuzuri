name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: make validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install: true
          install_args: rumdl typos
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Verify Bun is absent
        run: '! command -v bun'

      - name: Install dependencies
        run: make install

      - name: Run the pre-PR gate
        run: make validate

  node:
    name: make node-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          install: true
          install_args: bun node
          cache: true

      - name: Install dependencies
        run: make install

      - name: Run the read commands on Node
        run: make node-smoke
